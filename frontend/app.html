<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>메모 앱 (React)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [memos, setMemos] = React.useState([]);
            const [accessToken, setAccessToken] = React.useState("");
            const [username, setUsername] = React.useState("");
            const [password, setPassword] = React.useState("");
            const [title, setTitle] = React.useState("");
            const [content, setContent] = React.useState("");
            const [question, setQuestion] = React.useState("");
            const [answer, setAnswer] = React.useState("");

            function login() {
                fetch("http://127.0.0.1:8000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: username, password: password })
                })
                    .then(function(response) {
                        if (!response.ok) {
                            alert("로그인 실패");
                            return null;
                        }
                        return response.json();
                    })
                    .then(function(data) {
                        setAccessToken(data.access_token);
                    });
            }

            function loadMemos() {
                fetch("http://127.0.0.1:8000/memos", {
                    headers: { "Authorization": "Bearer " + accessToken }
                })
                    .then(function(response) {
                        if (!response.ok) {
                            setMemos([]);
                            return null;
                        }
                        return response.json();
                    })
                    .then(function(data) {
                        if (data === null) {
                            return;
                        }
                        setMemos(data);
                    });
            }

            function createMemo() {
                fetch("http://127.0.0.1:8000/memos", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + accessToken
                    },
                    body: JSON.stringify({ title: title, content: content })
                })
                    .then(function(response) {
                        if (!response.ok) {
                            alert("메모 저장 실패");
                            return null;
                        }
                        return response.json();
                    })
                    .then(function(data) {
                        if (data === null) {
                            return;
                        }
                        setTitle("");
                        setContent("");
                        loadMemos();
                    });
            }

            function askQuestion() {
                fetch("http://127.0.0.1:8000/memos/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + accessToken
                    },
                    body: JSON.stringify({ question: question })
                })
                    .then(function(response) {
                        if (!response.ok) {
                            alert("질문 실패");
                            return null;
                        }
                        return response.json();
                    })
                    .then(function(data) {
                        if (data === null) {
                            return;
                        }
                        setAnswer(data.answer);
                    });
            }

            React.useEffect(function() {
                if (accessToken === "") {
                    return;
                }
                loadMemos();
            }, [accessToken]);

            return (
                <div>
                    <h2>로그인</h2>
                    <input
                        type="text"
                        placeholder="아이디"
                        value={username}
                        onChange={function(e) { setUsername(e.target.value); }}
                    />
                    <input
                        type="password"
                        placeholder="비밀번호"
                        value={password}
                        onChange={function(e) { setPassword(e.target.value); }}
                    />
                    <button onClick={login}>로그인</button>

                    <h2>메모 쓰기</h2>
                    <input
                        type="text"
                        placeholder="제목"
                        value={title}
                        onChange={function(e) { setTitle(e.target.value); }}
                    />
                    <input
                        type="text"
                        placeholder="내용"
                        value={content}
                        onChange={function(e) { setContent(e.target.value); }}
                    />
                    <button onClick={createMemo}>저장</button>

                    <h2>질문하기</h2>
                    <input
                        type="text"
                        placeholder="메모에 대해 질문하세요"
                        value={question}
                        onChange={function(e) { setQuestion(e.target.value); }}
                    />
                    <button onClick={askQuestion}>질문</button>
                    <p>{answer}</p>

                    <h2>내 메모</h2>
                    <ul>
                        {memos.map(function(memo) {
                            return <li key={memo.id}>{memo.title}</li>;
                        })}
                    </ul>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
