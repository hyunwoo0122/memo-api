<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>메모 앱</title>
</head>
<body>
    <h2>로그인</h2>
        <input type="text" id="username" placeholder="아이디">
        <input type="password" id="password" placeholder="비밀번호">
        <button onclick="login()">로그인</button>
    <h2>내 메모</h2>
    <ul id="memoList"></ul>

    <input type="text" id="memoTitle" placeholder="제목">
    <input type="text" id="memoContent" placeholder="내용">
    <button onclick="createMemo()">메모 추가</button>
    <script>

    var accessToken = "";

    function login() {
        var username = document.getElementById("username").value;
        var password = document.getElementById("password").value;

        fetch("http://127.0.0.1:8000/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                accessToken = data.access_token;
                loadMemos();
            });
}

    function createMemo() {
        var title = document.getElementById("memoTitle").value;
        var content = document.getElementById("memoContent").value;

        fetch("http://127.0.0.1:8000/memos", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + accessToken
            },
            body: JSON.stringify({
                title: title,
                content: content
            })
        })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                document.getElementById("memoTitle").value = "";
                document.getElementById("memoContent").value = "";
                loadMemos();
            });
    }

    function loadMemos() {
        fetch("http://127.0.0.1:8000/memos", {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + accessToken
            }
        })
            .then(function(response) {
                return response.json();
            })
            .then(function(memos) {
                var listElement = document.getElementById("memoList");
                listElement.innerHTML = "";

                for (var i = 0; i < memos.length; i++) {
                    var newItem = document.createElement("li");
                    newItem.textContent = memos[i].title;
                    listElement.appendChild(newItem);
                }
            });
    }
    function askQuestion() {
        var question = document.getElementById("question").value;

        document.getElementById("answer").textContent = "답변을 생성하는 중입니다...";

        fetch("http://127.0.0.1:8000/memos/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + accessToken
            },
            body: JSON.stringify({
                question: question
            })
        })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                document.getElementById("answer").textContent = data.answer;
            });
}

</script>
    <h2>메모에게 질문하기</h2>
    <input type="text" id="question" placeholder="궁금한 걸 물어보세요">
    <button onclick="askQuestion()">질문하기</button>
    <p id="answer"></p>
</body>
</html>
